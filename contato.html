<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EbenSystem Tecnologia | Contato</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- CABEÇALHO / NAVEGAÇÃO -->
    <header>
        <a href="index.html" class="logo-container">
            <div class="logo-icon"></div>
            <div>
                <span class="logo-text">EBEN<span>SYSTEM</span></span>
                <span class="logo-sub">TECNOLOGIA</span>
            </div>
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="servicos.html">Serviços</a></li>
                <li><a href="historia.html">A Empresa</a></li>
                <li><a href="clientes.html">Clientes</a></li>
                <li><a href="contato.html" class="active">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>
        <section style="text-align: center; margin-bottom: 3.5rem;">
            <h1>Fale Conosco</h1>
            <p style="color: var(--text-secondary); max-width: 700px; margin: 0.5rem auto 0;">
                Preencha os dados abaixo para avaliarmos a melhor solução de TI para o seu negócio.
            </p>
        </section>

        <!-- CARTÃO DO FORMULÁRIO COMERCIAL -->
        <div class="card" style="max-width: 650px; margin: 0 auto 4rem;">
            <span class="tech-tag" style="display: block; text-align: center; margin-bottom: 1.5rem;">SOLICITAÇÃO DE CONTATO</span>

            <form id="contatoForm">
                
                <!-- NOME -->
                <div style="margin-bottom: 1.25rem;">
                    <label for="nome" style="display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; color: #fff;">
                        Nome Completo
                    </label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome" required style="width: 100%; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); color: #fff; font-family: inherit; font-size: 1rem;">
                </div>

                <!-- EMPRESA -->
                <div style="margin-bottom: 1.25rem;">
                    <label for="empresa" style="display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; color: #fff;">
                        Nome da Empresa
                    </label>
                    <input type="text" id="empresa" name="empresa" placeholder="Sua empresa" required style="width: 100%; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); color: #fff; font-family: inherit; font-size: 1rem;">
                </div>

                <!-- E-MAIL -->
                <div style="margin-bottom: 1.25rem;">
                    <label for="email" style="display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; color: #fff;">
                        E-mail Corporativo
                    </label>
                    <input type="email" id="email" name="email" placeholder="nome@empresa.com.br" required style="width: 100%; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); color: #fff; font-family: inherit; font-size: 1rem;">
                </div>

                <!-- TELEFONE -->
                <div style="margin-bottom: 1.25rem;">
                    <label for="telefone" style="display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; color: #fff;">
                        WhatsApp / Telefone
                    </label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required style="width: 100%; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); color: #fff; font-family: inherit; font-size: 1rem;">
                </div>

                <!-- MENSAGEM -->
                <div style="margin-bottom: 1.5rem;">
                    <label for="mensagemInput" style="display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; color: #fff;">
                        Como podemos ajudar?
                    </label>
                    <textarea id="mensagemInput" name="mensagem" rows="4" placeholder="Descreva brevemente sua necessidade em TI" required style="width: 100%; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); color: #fff; font-family: inherit; font-size: 1rem; resize: vertical;"></textarea>
                </div>

                <!-- BOTÃO -->
                <button type="submit" id="botaoEnviar" class="btn-primary" style="width: 100%; justify-content: center; cursor: pointer; border: none; font-size: 1rem;">
                    <i class="fa-solid fa-paper-plane"></i> Enviar Mensagem
                </button>

                <!-- MENSAGEM DE STATUS -->
                <div id="mensagemStatus" style="display: none; margin-top: 1.25rem; padding: 1rem; border-radius: 8px; text-align: center; font-size: 0.95rem; line-height: 1.5;"></div>

            </form>
        </div>
    </main>

    <!-- RODAPÉ -->
    <footer>
        <div class="footer-bottom">
            <p>&copy; 2026 EbenSystem Tecnologia LTDA. Todos os direitos reservados. | www.ebensystem.com.br</p>
        </div>
    </footer>

    <!-- SCRIPT DE ENVIO GOOGLE SHEETS -->
 <script>
    /* Cole aqui o seu link de implantação do Apps Script */
    const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbxbaqxP5i2WHzeRXm_CP9tS21ItWK4qnkqc0J8f_REmZSvTwFLXLMEnH2UUDY3efSYDhw/exec";

    const formulario = document.getElementById("contatoForm");
    const botao = document.getElementById("botaoEnviar");
    const mensagemStatus = document.getElementById("mensagemStatus");

    formulario.addEventListener("submit", function(event) {
        event.preventDefault();

        const dados = {
            nome: document.getElementById("nome").value.trim(),
            empresa: document.getElementById("empresa").value.trim(),
            email: document.getElementById("email").value.trim(),
            telefone: document.getElementById("telefone").value.trim(),
            mensagem: document.getElementById("mensagemInput").value.trim()
        };

        botao.disabled = true;
        botao.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Enviando...';
        mensagemStatus.style.display = "none";

        fetch(URL_GOOGLE_SCRIPT, {
            method: "POST",
            mode: "no-cors", // Resolve o bloqueio de política de origem (CORS)
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(dados)
        })
        .then(() => {
            mensagemStatus.style.display = "block";
            mensagemStatus.style.background = "rgba(40, 120, 60, 0.3)";
            mensagemStatus.style.border = "1px solid rgba(100, 220, 120, 0.5)";
            mensagemStatus.style.color = "#b9ffc5";
            mensagemStatus.innerHTML = "✓ Solicitação enviada com sucesso!<br>Em breve entraremos em contato.";

            formulario.reset();
        })
        .catch((erro) => {
            mensagemStatus.style.display = "block";
            mensagemStatus.style.background = "rgba(150, 40, 40, 0.3)";
            mensagemStatus.style.border = "1px solid rgba(255, 100, 100, 0.5)";
            mensagemStatus.style.color = "#ffbaba";
            mensagemStatus.innerHTML = "Não foi possível enviar a mensagem.<br>Por favor, tente novamente mais tarde.";
            console.error(erro);
        })
        .finally(() => {
            botao.disabled = false;
            botao.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Enviar Mensagem';
        });
    });
</script>
